    <script>
        const mensajes = {
            datos: 'Revisa que todos los campos sean válidos.',
            error: 'No se pudo registrar el usuario. Inténtalo de nuevo más tarde.'
        };
        const estado = new URLSearchParams(window.location.search).get('estado');
        if (mensajes[estado]) {
            const aviso = document.getElementById('estadoFormulario');
            aviso.textContent = mensajes[estado];
            aviso.classList.remove('d-none');
            aviso.classList.add(estado === 'error' ? 'alert-danger' : 'alert-warning');
        }
    </script>
